# 웹 화면 저장(이미지·PDF) 확인 — 예시 데이터로 실제 html2canvas·jsPDF를 받아서 실행
name: 웹 저장 테스트
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          python build.py
          mkdir -p out
          python test/t_png.py out 2>&1 | tee out/log.txt | while IFS= read -r l; do echo "::notice::$l"; done
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp -r out "$RUNNER_TEMP/out"
          git checkout --orphan webtest && git rm -rqf . && cp "$RUNNER_TEMP/out/"* . && git add -A && git commit -qm "웹 저장 테스트 $GITHUB_SHA" && git push -f origin webtest
