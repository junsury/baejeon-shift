# 위젯 그림 미리보기(예시 데이터)를 만들어 previews 브랜치에 올려요 — 개발 확인용
name: 위젯 미리보기
on:
  push:
    branches: [main]
    paths: ['android/app/src/main/java/**', 'android/app/src/test/**', '.github/workflows/widget-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 그리기
        run: |
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          set +e
          gradle -p android testDebugUnitTest --no-daemon > "$RUNNER_TEMP/t.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/t.txt"
          if [ $code -ne 0 ]; then grep -E "error:|FAILED|What went wrong|Exception|at kr\.baejeon|\.java:[0-9]+" "$RUNNER_TEMP/t.txt" | head -25 | while IFS= read -r l; do echo "::error::$l"; done; for f in android/app/build/test-results/testDebugUnitTest/*.xml; do grep -m3 -A3 "<failure" "$f" | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done; exit $code; fi
      - name: previews 브랜치에 올리기
        run: |
          mkdir -p "$RUNNER_TEMP/pv" && cp android/app/build/previews/*.png "$RUNNER_TEMP/pv/"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan previews && git rm -rqf . && cp "$RUNNER_TEMP/pv/"*.png . && git add *.png && git commit -qm "위젯 미리보기 $GITHUB_SHA" && git push -f origin previews
