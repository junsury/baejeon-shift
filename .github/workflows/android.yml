# 갤럭시용 앱(APK)을 만들어 GitHub 릴리스(android)에 올려요.
# 받는 주소: https://github.com/junsury/baejeon-shift/releases/download/android/baejeon-shift.apk
name: 갤럭시 앱 만들기
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: android
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 서명 열쇠 준비
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/ks" && cd "$RUNNER_TEMP/ks" && npm init -y >/dev/null && npm install firebase-admin@12 --no-audit --no-fund --silent
          NODE_PATH="$RUNNER_TEMP/ks/node_modules" node "$GITHUB_WORKSPACE/android/ci/keystore.js" "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/release.p12"
      - name: 계산 점검 (음력·반복 일정)
        run: |
          set +e
          gradle -p android testDebugUnitTest --tests 'kr.baejeon.shift.LunarTest' --no-daemon > "$RUNNER_TEMP/t.txt" 2>&1
          code=$?
          if [ $code -ne 0 ]; then grep -E "error:|FAILED|AssertionError|expected|\.java:[0-9]+" "$RUNNER_TEMP/t.txt" | head -25 | while IFS= read -r l; do echo "::error::$l"; done; for f in android/app/build/test-results/testDebugUnitTest/*.xml; do grep -m3 -A3 "<failure" "$f" | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done; exit $code; fi
      - name: APK 만들기
        run: |
          set +e
          gradle -p android assembleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/build.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/build.txt"
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILED|What went wrong|Could not|AAPT|\.java:[0-9]+" "$RUNNER_TEMP/build.txt" | sed 's/\x1b\[[0-9;]*m//g' | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
      - name: 앱-웹 연결 정보 (assetlinks.json)
        run: |
          fp=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias baejeon | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')
          echo "SHA256 $fp"
          fp1=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias baejeon | grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d ' \r')
          mkdir -p app/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"kr.baejeon.shift","sha256_cert_fingerprints":["%s"]}}]\n' "$fp" > app/.well-known/assetlinks.json
          cat app/.well-known/assetlinks.json
          NODE_PATH="$RUNNER_TEMP/ks/node_modules" node android/ci/register.js "$RUNNER_TEMP/sa.json" "$fp" "$fp1"
          if [ -n "$(git status --porcelain app/.well-known)" ]; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add app/.well-known/assetlinks.json && git commit -m "assetlinks 갱신" && git push
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            npx --yes firebase-tools@13 deploy --only hosting --project baejeon-shift --non-interactive > "$RUNNER_TEMP/h.txt" 2>&1 || { tail -5 "$RUNNER_TEMP/h.txt" | while IFS= read -r l; do echo "::warning::$l"; done; }
            grep -i "file" "$RUNNER_TEMP/h.txt" | head -3 | while IFS= read -r l; do echo "::notice::$l"; done
          fi
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk baejeon-shift.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "갤럭시 앱 (근무표)" --notes "갤럭시 휴대폰에서 baejeon-shift.apk 를 받아 설치하세요. 새 버전은 같은 주소로 올라가요."
          gh release upload android baejeon-shift.apk --clobber
          gh release edit android --notes "갤럭시 휴대폰에서 baejeon-shift.apk 를 받아 설치하세요. 버전 1.0.${GITHUB_RUN_NUMBER} ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
