# 앱 화면(app/ → Firebase Hosting), 보안 규칙, 알림 서버(functions/)를 Firebase에 자동 배포
# 필요: 저장소 Settings → Secrets → Actions 에 FIREBASE_SERVICE_ACCOUNT (서비스 계정 키 JSON 전체)
name: Firebase 배포
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', 'app/**', 'src/**', 'test/**', 'build.py', '.github/workflows/firebase.yml']
  workflow_dispatch:
jobs:
  # 배포 전에 화면 테스트: 크롬(갤럭시) + 사파리 엔진(아이폰). 하나라도 실패하면 배포 안 함
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 준비
        run: |
          pip install -q playwright && python -m playwright install --with-deps ${{ matrix.browser }} >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
      - name: 만든 화면이 최신인지 (src → app)
        run: |
          python build.py >/dev/null
          git diff --quiet -- app/index.html || { echo "::error::app/index.html이 src와 달라요 (build.py를 안 돌리고 올림)"; git diff --stat; exit 1; }
      - name: 화면 테스트 (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          NET: ${{ matrix.browser == 'chromium' && '1' || '0' }}
        run: |
          mkdir -p out
          python test/all.py out 2>&1 | tee out/all.txt
          code=${PIPESTATUS[0]}
          grep -E "^FAIL" out/all.txt | while IFS= read -r l; do echo "::error::${{ matrix.browser }} $l"; done
          exit $code
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: 서비스 계정 키 확인
        if: env.SA == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어서 Firebase 배포를 건너뛰어요."
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with:
          node-version: 20
      - name: 알림 서버 준비
        if: env.SA != ''
        run: cd functions && npm install --no-audit --no-fund
      - name: 배포 (규칙 + 알림 서버)
        if: env.SA != ''
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud services enable cloudbilling.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com fcm.googleapis.com cloudscheduler.googleapis.com pubsub.googleapis.com firebasehosting.googleapis.com calendar-json.googleapis.com --project baejeon-shift --quiet || true
          set +e
          npx --yes firebase-tools@13 deploy --only firestore:rules,functions,hosting --project baejeon-shift --force --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          if [ $code -ne 0 ]; then grep -v '^\s*$' "$RUNNER_TEMP/out.txt" | sed 's/\x1b\[[0-9;]*m//g' | tail -9 | while IFS= read -r l; do echo "::error::$l"; done; exit $code; fi
